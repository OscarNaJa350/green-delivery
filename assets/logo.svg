<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Green School Warehouse">
  <defs>
    <linearGradient id="lgBg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#33955a" />
      <stop offset="52%" stop-color="#1f6f3d" />
      <stop offset="100%" stop-color="#123f24" />
    </linearGradient>
    <linearGradient id="lgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aeea63" />
      <stop offset="100%" stop-color="#6cc42b" />
    </linearGradient>
    <linearGradient id="lgLeaf" x1="6%" y1="92%" x2="94%" y2="8%">
      <stop offset="0%" stop-color="#2f9b45" />
      <stop offset="100%" stop-color="#86d857" />
    </linearGradient>
  </defs>

  <!-- App icon plate -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#lgBg)" />

  <!-- Warehouse: roof + pillars + floor -->
  <path d="M50 24 L85 51 L85 60 L50 33 L15 60 L15 51 Z" fill="#f6fcf5" />
  <rect x="23" y="55" width="9" height="27" rx="2.5" fill="#eef8ec" />
  <rect x="68" y="55" width="9" height="27" rx="2.5" fill="#eef8ec" />
  <rect x="23" y="78" width="54" height="6" rx="2.5" fill="#eef8ec" />

  <!-- Stacked green crates -->
  <g>
    <rect x="33.5" y="49" width="18" height="31" rx="2" fill="url(#lgBox)" />
    <path d="M39 49h7v8l-3.5-3.4L39 57z" fill="#eef8ec" />
  </g>
  <g>
    <rect x="52" y="42" width="21" height="38" rx="2" fill="url(#lgBox)" opacity="0.92" />
    <path d="M58.5 42h8v8l-4-3.4-4 3.4z" fill="#eef8ec" />
  </g>

  <!-- Leaf emblem -->
  <path d="M25 86C27 63 44 46 71 42c2 27-16 46-46 44z" fill="#f6fcf5" />
  <path d="M31 82c3-17 13-29 31-36-4 21-15 33-31 36z" fill="url(#lgLeaf)" />
  <path d="M25 86C33 75 46 62 63 50" stroke="#f6fcf5" stroke-width="2.2" fill="none" stroke-linecap="round" />
</svg>
